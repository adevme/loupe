name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p loupe -p loupe-host -p loupe-launcher
      - name: Gather
        shell: bash
        run: |
          mkdir -p installer/build
          cp target/release/loupe.exe installer/build/loupe.exe
          cp target/release/loupe-host.exe installer/build/loupe-host.exe
          cp target/release/loupe-launcher.exe installer/build/Loupe.exe
      - name: Work out the version
        id: version
        shell: bash
        run: echo "number=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Make the installer
        shell: cmd
        working-directory: installer
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /Q /DAppVersion=${{ steps.version.outputs.number }} loupe.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: installer/output/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build
        run: cargo build --release -p loupe -p loupe-host
      - name: Gather
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out/loupe-$version
          cp target/release/loupe target/release/loupe-host out/loupe-$version/
          cp README.md out/loupe-$version/
          tar -C out -czf out/loupe-$version-linux-x86_64.tar.gz loupe-$version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: out/*.tar.gz

  publish:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Checksums
        run: |
          mkdir -p release
          find downloaded -type f \( -name '*.exe' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
