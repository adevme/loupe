name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p loupe -p loupe-host -p loupe-launcher
      - name: Gather
        shell: bash
        run: |
          mkdir -p installer/build
          cp target/release/loupe.exe installer/build/loupe.exe
          cp target/release/loupe-host.exe installer/build/loupe-host.exe
          cp target/release/loupe-launcher.exe installer/build/Loupe.exe
      - name: Work out the version
        id: version
        shell: bash
        run: echo "number=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Make the installer
        shell: cmd
        working-directory: installer
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /Q /DAppVersion=${{ steps.version.outputs.number }} loupe.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: installer/output/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config desktop-file-utils
      - name: Build
        run: cargo build --release -p loupe -p loupe-host
      - name: Work out the version
        id: version
        run: echo "number=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build the AppImage
        run: |
          version=${{ steps.version.outputs.number }}
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/loupe target/release/loupe-host AppDir/usr/bin/
          cp crates/app/assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/loupe.png
          cp crates/app/assets/icon.png AppDir/loupe.png
          cat > AppDir/loupe.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Loupe
          Comment=A digital audio workstation
          Exec=loupe %f
          Icon=loupe
          Categories=AudioVideo;Audio;
          MimeType=application/x-loupe-project;
          Terminal=false
          DESKTOP
          cp AppDir/loupe.desktop AppDir/usr/share/applications/loupe.desktop
          cat > AppDir/AppRun <<'RUN'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")"
          export PATH="$here/usr/bin:$PATH"
          exec "$here/usr/bin/loupe" "$@"
          RUN
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null
          mkdir -p out
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "out/Loupe-$version-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: out/*.AppImage

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both chips
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --target aarch64-apple-darwin -p loupe -p loupe-host
          cargo build --release --target x86_64-apple-darwin -p loupe -p loupe-host
      - name: Work out the version
        id: version
        run: echo "number=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Make the app and the disk image
        run: |
          version=${{ steps.version.outputs.number }}
          app="Loupe.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          lipo -create -output "$app/MacOS/loupe" target/aarch64-apple-darwin/release/loupe target/x86_64-apple-darwin/release/loupe
          lipo -create -output "$app/MacOS/loupe-host" target/aarch64-apple-darwin/release/loupe-host target/x86_64-apple-darwin/release/loupe-host
          mkdir icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size crates/app/assets/icon.png --out "icon.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) crates/app/assets/icon.png --out "icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Resources/loupe.icns"
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Loupe</string>
            <key>CFBundleDisplayName</key><string>Loupe</string>
            <key>CFBundleIdentifier</key><string>me.adev.loupe</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleExecutable</key><string>loupe</string>
            <key>CFBundleIconFile</key><string>loupe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Loupe records audio from the input you choose.</string>
          </dict></plist>
          PLIST
          mkdir -p out staging
          cp -R Loupe.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Loupe $version" -srcfolder staging -ov -format UDZO "out/Loupe-$version-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: out/*.dmg

  publish:
    needs: [windows, linux, mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Checksums
        run: |
          mkdir -p release
          find downloaded -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
