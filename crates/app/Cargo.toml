[package]
name = "loupe"
version.workspace = true
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
loupe-engine = { path = "../engine" }
loupe-plugins = { path = "../plugins" }
loupe-stock = { path = "../stock" }
loupe-stock-ui = { path = "../stock-ui" }
iced = { version = "0.13", features = ["tokio", "canvas", "advanced", "image"] }
rfd = "0.14"
ureq = "2"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
sha2 = "0.10"
iced_runtime = "0.13"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11-dl = "2.21"
